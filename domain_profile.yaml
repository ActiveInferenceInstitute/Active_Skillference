domain: code_research
display_name: Active Inference Micro-Learning Platform
required_packages:
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - pytest
preferred_outputs:
  - pdf
  - html
validation_gates:
  - experiment_method_design
  - artifact_manifest
  - evidence_grounding
  - render_validation
  - publication_readiness
figure_types:
  - curriculum_dag
  - free_energy_descent
  - efe_decomposition
citation_policy: official_or_scholarly
source_policy: "Prefer primary project outputs (tested kernels, the validated curriculum graph, and the SkillTree export) and scholarly Active Inference / Free Energy Principle references."
review_gates:
  - experiment_method_design
  - render_validation
  - publication_readiness
artifact_expectations:
  - output/data/claims.json
  - output/data/manuscript_variables.json
  - output/data/curriculum_stats.json
  - output/data/skilltree_project.json
  - output/figures/curriculum_dag.png
  - output/figures/free_energy_descent.png
  - output/figures/efe_decomposition.png
  - output/pdf/Active_Skillference_combined.pdf
benchmark_rubric:
  name: code-research-readiness
  dimensions:
    - name: output_validity
      weight: 1.0
    - name: reproducibility_bundle
      weight: 1.0
    - name: artifact_manifest
      weight: 1.0
    - name: evidence_grounding
      weight: 2.0
    - name: render_success
      weight: 1.0
    - name: publication_readiness
      weight: 1.0
llm_prompt_guidance: "Use the registered provenance claims (output/data/claims.json) and the validated curriculum graph as the evidence source; never hand-type a kernel result number — reference it through a {{claim:NAME}} token."
