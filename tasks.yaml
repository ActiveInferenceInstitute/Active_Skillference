    status: done
    scale: medium
    surface: skilltree
    owner: src/skilltree/local_auth.py
    evidence:
      - uv run pytest tests/test_skilltree_seeder.py tests/test_dependency_reconciler.py -q
    notes: >-
      SkillTreeSessionClient.assign_dependency deletes a stale reverse prerequisite
      and then POSTs the replacement. If the DELETE succeeds but the follow-up POST
      fails, live SkillTree is left missing that edge while the in-memory
      _dependency_pairs cache was already discarded, so a later run can mis-seed
      non-deterministically with no recovery path. Make the delete-then-reseed
      transactional, or re-fetch the live graph on the failure path before raising.
    scholarship_plan:
      lanes:
