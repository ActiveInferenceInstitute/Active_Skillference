  - id: asf-skilltree-452-live-reverify
    title: Live re-verify local SkillTree stack against skills-service 4.5.2
    status: done
    scale: minor
    surface: skilltree
    owner: docker-compose.yml
    deps:
      - asf-skilltree-live-recheck
    metrics:
      skills: 630
      subjects: 111
      prerequisite_edges: 1199
      quizzes: 630
    evidence:
      - uv run python scripts/reset_local_skilltree.py --confirm-local-reset --timeout 1200
      - "proof.ok=true; proof.mode=app-ready; liveAdminProject.skills=630;
        artifacts present=42/42; figureContracts registered=21/dashboard=21;
        browserConsole 'dashboard console gate OK'; rawSkillTreeLogin
        adminSurfaceVisible=true, title='SkillTree Dashboard - Project Administrator'"
      - uv run python scripts/validate_docker_digests.py
      - uv run pytest tests/ --cov=src --cov-report=term-missing -q (814 passed, 90.17%)
    notes: >-
      Closed 2026-07-04. Two real bugs surfaced and fixed en route (both pre-existing, not
      introduced by the 4.5.2 bump, but blocking this task): (1)
      scripts/validate_full_app_stack.py called `docker compose up -d` without first setting
      ACTIVE_SKILLFERENCE_POSTGRES_PASSWORD the way scripts/run_skilltree.sh does, so the
      documented vendor/README.md one-liner failed on a fresh checkout; fixed by adding
      src/integration/full_app_stack.py:ensure_postgres_password() (same state-dir-scoped file
      convention as the shell script) and calling it before the compose command. (2)
      scripts/reset_local_skilltree.py's `docker compose down -v` has the same interpolation
      requirement and had the same gap; fixed by calling the same ensure_postgres_password()
      helper there too. A stale skilltree_auth.json from the 2026-06-22 4.4.2 run also caused a
      transient 401 on the first clean-volume attempt (stored admin credentials no longer matched
      the freshly-initialized Postgres DB) — resolved by using the documented
      reset_local_skilltree.py path (which backs up + removes local auth state before resetting
      the volume) instead of a bare `docker compose down -v`. Final run: `--app-ready` proof is
      green end-to-end against 4.5.2 (root bootstrap, project seed, dashboard health, figure
      contracts, browser console gate, raw FORM login all passed). Full live-dependency parity
      (1199/1199 edges via the admin REST API) was NOT attempted here — `--app-ready` explicitly
      skips it, consistent with this project's own prior finding that per-edge REST dependency
      validation is too slow at the 600-skill scale (see asf-skilltree-live-recheck's notes); that
      remains a separately-scoped, still-open concern independent of this version bump. Docker
      containers and the dashboard process were stopped and the compose volume removed after
      recording evidence, per the "disposable outputs" convention.
  - id: asf-skilltree-460-live-reverify
    title: Live re-verify the pinned SkillTree stack (4.6.0; upstream is 5.0.5)
    status: todo
    scale: minor
    surface: skilltree
    owner: docker-compose.yml
    deps:
      - asf-skilltree-452-live-reverify
    metrics:
      skills: 630
      subjects: 111
      prerequisite_edges: 1199
      quizzes: 630
    evidence:
      - gh api repos/NationalSecurityAgency/skills-service/releases/latest --jq .tag_name
      - uv run python scripts/reset_local_skilltree.py --confirm-local-reset --timeout 1200
      - uv run python scripts/validate_docker_digests.py
    notes: >-
      Opened 2026-08-01 after bumping the pinned runtime from skills-service 4.5.2 to 4.6.0
      (upstream release 2026-07-28). docker-compose.yml postgres:15 digest and the
      skills-service tag+digest were refreshed via the documented Docker Hub procedure
      (skills-service 4.6.0 = sha256:071220ce..., single-arch; postgres:15 = sha256:74e110c4...,
      multi-arch incl. arm64), and AuthMode was re-confirmed as FORM/PKI/SAML2 at the 4.6.0 tag
      (no PKI_OR_FORM). The digest pin and docs were updated, but no live full-app boot against
      4.6.0 was recorded because Docker was not running on the reconciliation host. Per the
      provenance-over-assertion principle, the 4.5.2 live records (asf-skilltree-452-live-reverify)
      do NOT prove anything about 4.6.0; run the full-app proof (reset_local_skilltree.py
      --confirm-local-reset --timeout 1200) against 4.6.0 and record proof.ok here before reading
      this pin as live-verified.
      2026-08-09 partial progress on a Docker-capable host, recorded without claiming the phase
      exit: validate_docker_digests.py passes against the running stack, and the strict
      full-parity proof (validate_full_app_stack.py --skip-regenerate, see
      asf-live-stack-ci-rehearsal) is green against skills-service 4.6.0 with 1199/1199 live
      dependencies, 630 live admin skills, raw FORM login, and the browser console gate. What is
      still NOT proven is the fresh-volume path this task actually asks for: whether the
      documented default root credentials bootstrap correctly on a newly created 4.6.0 volume.
      That requires the destructive reset (docker compose down -v), which would also discard the
      1199/1199 parity that took roughly an hour of per-edge writes to reach on this Apple/ARM
      host, so it is deliberately left for an explicit maintainer run rather than folded in here.
      2026-11-12 currency check, recorded without claiming the phase exit: upstream's latest release
      is now skills-service 5.0.5 (published 2026-11-12), so the pinned 4.6.0 is a major version
      behind and validate_docker_digests.py can keep passing on a pin that is itself stale. Settle
      the order before spending a live run: prove 4.6.0 as pinned and bump in a separate change, or
      retarget the pin first (docker-compose.yml tag+digest, docs/gates.md, vendor/README.md) and
      prove that. Either path needs a Docker-capable host and a maintainer's explicit destructive
      run (docker compose down -v) to reach the fresh-volume bootstrap this task actually asks
      about, so the maintainer is the only party who can close it.
