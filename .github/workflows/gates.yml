name: gates

# The offline half of this project's fail-closed gate set. The live half
# (Docker + SkillTree + browser proofs, and the captured-evidence refresh)
# needs a Docker daemon and a real browser, so it stays a local proof and is
# deliberately not simulated here — a green badge must not imply a live check
# that never ran.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Lint and format
        run: |
          uvx ruff check src scripts tests
          uvx ruff format --check src scripts tests

      - name: Type check
        run: uv run mypy src

      - name: Build the curriculum and generated artifacts
        run: |
          uv run python scripts/build_curriculum.py
          uv run python scripts/run_kernels.py
          uv run python scripts/export_skilltree.py

      - name: Provenance, scholarship, and manuscript gates
        run: |
          uv run python scripts/validate_claim_support.py
          uv run python scripts/validate_manuscript_artifacts.py
          uv run python scripts/validate_manuscript_variables.py
          uv run python scripts/validate_american_english.py
          uv run python scripts/validate_scholarship_sources.py
          uv run python scripts/validate_course_material_alignment.py
          uv run python scripts/validate_learner_pilot_contract.py
          uv run python scripts/validate_live_counts.py
          uv run python scripts/validate_roadmap.py
          uv run python scripts/validate_docker_digests.py

      - name: Tests with the coverage floor
        run: uv run pytest --cov=src --cov-fail-under=90 -q
