name: gates

# The offline half of this project's fail-closed gate set. The live half
# (Docker + SkillTree + browser proofs, and the captured-evidence refresh)
# needs a Docker daemon and a real browser, so it stays a local proof and is
# deliberately not simulated here — a green badge must not imply a live check
# that never ran.
#
# Every step delegates to an arm of ./gates.sh, so CI and a local run execute the
# same command text and a change to a gate lands in one place. See docs/gates.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      # One environment for every gate below: the locked set, synced once.
      - name: Sync the locked environment
        run: ./gates.sh sync

      - name: Lint and format
        run: ./gates.sh lint

      - name: Type check
        run: ./gates.sh types

      - name: Build the curriculum and generated artifacts
        run: ./gates.sh artifacts

      - name: Provenance, scholarship, and manuscript gates
        run: ./gates.sh checks

      - name: Tests with the coverage floor
        run: ./gates.sh test

      - name: Documentation links and generated gate metrics
        run: ./gates.sh docs

  gnn-conformance:
    timeout-minutes: 60
    # Validates gnn/discrete_active_inference_agent.gnn.md with the upstream
    # parser revision pinned in gnn/upstream.json. The pinned revision is
    # fetched from the public repository at the recorded SHA into its own
    # runtime; the strict gate never skips, and tests/test_gnn_conformance.py
    # fails (never skips) when the explicitly selected GNN_ROOT checkout is
    # missing or unusable.
    #
    # This job keeps its own environment on purpose: the extractor must import
    # from the pinned upstream tree, never from the project environment. Hosted
    # jobs cannot share a filesystem, so this is the one install the workflow
    # pays twice; both jobs run the same ./gates.sh arms and share the uv cache.
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      # `uv run` inside the arm syncs the locked set on demand, so the explicit
      # sync step the gates job needs (for the tools it runs repeatedly) is not
      # repeated here.
      - name: Provision the pinned GNN parser runtime
        env:
          GNN_ROOT: ${{ runner.temp }}/gnn
        run: |
          REVISION=$(python -c "import json; print(json.load(open('gnn/upstream.json'))['commit'])")
          TAG=$(python -c "import json; print(json.load(open('gnn/upstream.json'))['tag'])")
          git init --quiet "$GNN_ROOT"
          git -C "$GNN_ROOT" remote add origin \
            https://github.com/ActiveInferenceInstitute/Generalized_Notation_Notation.git
          # A pin that no longer resolves upstream fails here rather than skipping.
          git -C "$GNN_ROOT" fetch --depth 1 origin "$REVISION" "refs/tags/$TAG:refs/tags/$TAG"
          git -C "$GNN_ROOT" checkout --quiet --detach "$REVISION"
          uv venv --python 3.12 --no-project "$GNN_ROOT/.venv"
          # The pinned extractor needs numpy and defusedxml; a missing dependency
          # fails the run loudly instead of degrading to a skip.
          uv pip install --python "$GNN_ROOT/.venv/bin/python" numpy defusedxml

      - name: Validate the specification and run the pinned conformance tests
        env:
          GNN_ROOT: ${{ runner.temp }}/gnn
        run: ./gates.sh gnn

      - name: Report the resolved GNN version
        run: |
          PIN=gnn/upstream.json
          VERSION=$(python3 -c "import json;print(json.load(open('$PIN'))['tag'].removeprefix('v'))")
          test -n "$VERSION"
          echo "gnn-version=${VERSION}" >> "$GITHUB_STEP_SUMMARY"
