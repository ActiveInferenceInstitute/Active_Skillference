# Active_Skillference — project configuration
# Inherits workspace settings from root pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "active_skillference"
version = "1.0.1"
description = "High-integrity micro-learning platform for Active Inference & the Free Energy Principle on SkillTree"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"
markers = [
    "requires_browser: browser subprocess or chrome-devtools-axi integration (opt-in)",
]

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate. Do not hardcode the live coverage % here —
# it drifts; re-run `uv run pytest --cov=src` for the current figure.
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
# `src/` is a package (has __init__.py); modules resolve as src.<pkg>.<mod> — a single
# canonical name, so run mypy as `mypy src` (no MYPYPATH, no dual module identity).
warn_unused_ignores = false

[[tool.mypy.overrides]]
# scipy ships no type stubs (no py.typed); silence the missing-stub import error only.
module = ["scipy.*"]
ignore_missing_imports = true

[tool.uv]
required-version = "==0.13.7"
constraint-dependencies = ["pillow>=13.0.0"]

[dependency-groups]
# The tools the documented gates run (`uv run pytest`, `uv run mypy src`) must be
# part of the default `uv sync` set, or the gates depend on an ambient install.
dev = [
    "mypy>=1.15",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-httpserver>=1.1.5",
]
# Inherits workspace settings from root pyproject.toml
